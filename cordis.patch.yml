# dsh-lark-bridge — installable DSH profile bundle layer.
# M3: resilient Feishu transport, persistent sessions and interactive cards.
# The plugin row below is merged into the profile tree
# after dsh-base / dsh-web-app; config keys must match src Config schema.
- insert:
    - id: dsh-lark-bridge
      name: '@tankecho42/dsh-lark-bridge'
      config:
        appId: ''
        appSecret: ''
        dataDir: ''
        webUrl: 'http://127.0.0.1:3080'
        defaultCwd: ''
        workspaceRoots: []
        allowedUserIds: []
        allowedChatIds: []
        adminUserIds: []
        logMaxBytes: 5242880
        logBackups: 3
        autoStart: true
